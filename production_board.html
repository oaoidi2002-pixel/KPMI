<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>생산현황 통합보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#0A0E13;
  --panel:#131920;
  --panel-2:#1A222B;
  --border:#242E3A;
  --border-soft:#1D2530;
  --text:#EAEFF5;
  --text-dim:#8A97A8;
  --text-faint:#5B6675;
  --jc:#E8A33D;
  --jc-dim:rgba(232,163,61,.13);
  --jc-line:rgba(232,163,61,.35);
  --wj:#3FA9F5;
  --wj-dim:rgba(63,169,245,.13);
  --wj-line:rgba(63,169,245,.35);
  --ok:#2ECC71;
  --ok-dim:rgba(46,204,113,.14);
  --warn:#F2B33D;
  --warn-dim:rgba(242,179,61,.14);
  --bad:#F0553F;
  --bad-dim:rgba(240,85,63,.14);
  --idle:#5B6675;
  --idle-dim:rgba(91,102,117,.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  width:100%;height:100%;
  overflow-x:hidden;
}
.num{font-family:'Space Grotesk','Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums;font-weight:600;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}

/* ===== Top bar ===== */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 28px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#0D1218,#0A0E13);
}
.brand{display:flex;align-items:center;gap:14px;}
.brand .mark{
  width:36px;height:36px;border-radius:8px;
  background:var(--panel-2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--text-dim);
}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.2px;}
.brand .sub{font-size:12px;color:var(--text-faint);margin-top:2px;}

.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px;}
.tab{
  padding:9px 20px;border-radius:7px;font-size:14px;font-weight:500;color:var(--text-dim);
  cursor:pointer;user-select:none;transition:background .15s,color .15s;
  border:1px solid transparent;
}
.tab.active{background:var(--panel-2);color:var(--text);border-color:var(--border);}
.tab[data-tab="jecheon"].active{color:var(--jc);border-color:var(--jc-line);background:var(--jc-dim);}
.tab[data-tab="wonju"].active{color:var(--wj);border-color:var(--wj-line);background:var(--wj-dim);}

.clockbox{text-align:right;}
.clockbox .clock{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:600;letter-spacing:.5px;}
.clockbox .date{font-size:12px;color:var(--text-faint);margin-top:2px;}
.livepill{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ok);
  background:var(--ok-dim);border:1px solid rgba(46,204,113,.3);
  padding:3px 9px;border-radius:20px;margin-top:6px;font-weight:500;
}
.livepill .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

/* ===== Process rail ===== */
.rail-wrap{padding:16px 28px 4px;border-bottom:1px solid var(--border);}
.rail-label{font-size:11px;color:var(--text-faint);margin-bottom:10px;letter-spacing:.4px;text-transform:uppercase;}
.rail{display:flex;align-items:stretch;gap:0;}
.rail-stage{
  flex:1;position:relative;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;min-width:0;
}
.rail-stage + .rail-stage{margin-left:10px;}
.rail-stage::before{
  content:"";position:absolute;top:-1px;left:0;right:0;height:2px;border-radius:8px 8px 0 0;
}
.rail-stage.st-ok::before{background:var(--ok);}
.rail-stage.st-warn::before{background:var(--warn);}
.rail-stage.st-bad::before{background:var(--bad);}
.rail-name{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rail-val{font-size:16px;margin-top:3px;}
.rail-arrow{
  display:flex;align-items:center;justify-content:center;width:18px;color:var(--text-faint);font-size:13px;flex:none;
}

/* ===== Main ===== */
.main{padding:20px 28px 30px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.section-title{
  display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);
  margin:26px 0 12px;letter-spacing:.3px;
}
.section-title .ln{flex:1;height:1px;background:var(--border);}

/* Factory summary card (combined view) */
.fcard{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:20px;position:relative;overflow:hidden;
}
.fcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;}
.fcard.jc::before{background:var(--jc);}
.fcard.wj::before{background:var(--wj);}
.fcard .fhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.fcard .fname{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;}
.fcard.jc .fname{color:var(--jc);}
.fcard.wj .fname{color:var(--wj);}
.badge-op{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;}
.badge-op.on{background:var(--ok-dim);color:var(--ok);}

.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.kpi{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:9px;padding:12px 14px;}
.kpi .k-label{font-size:11px;color:var(--text-faint);margin-bottom:6px;}
.kpi .k-val{font-size:22px;}
.kpi .k-val .unit{font-size:12px;color:var(--text-dim);font-weight:500;margin-left:3px;}
.kpi .k-sub{font-size:11px;color:var(--text-dim);margin-top:4px;}

.progress{height:7px;background:var(--panel-2);border-radius:4px;overflow:hidden;border:1px solid var(--border-soft);}
.progress > div{height:100%;border-radius:4px;transition:width .5s;}
.progress.ok > div{background:var(--ok);}
.progress.warn > div{background:var(--warn);}
.progress.bad > div{background:var(--bad);}

.eq-strip{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.eq-dot{
  display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);
  background:var(--panel-2);border:1px solid var(--border-soft);padding:5px 9px;border-radius:20px;
}
.eq-dot .d{width:7px;height:7px;border-radius:50%;}
.eq-dot .d.on{background:var(--ok);}
.eq-dot .d.off{background:var(--bad);}
.eq-dot .d.chk{background:var(--warn);}

/* Compare table */
.cmp-table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.cmp-table th{
  text-align:left;font-size:11px;color:var(--text-faint);font-weight:500;
  padding:12px 16px;background:var(--panel-2);border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.3px;
}
.cmp-table td{padding:13px 16px;font-size:14px;border-bottom:1px solid var(--border-soft);}
.cmp-table tr:last-child td{border-bottom:none;}
.cmp-table td.stage{color:var(--text-dim);}
.cmp-table td.jcv{color:var(--jc);}
.cmp-table td.wjv{color:var(--wj);}

/* Alerts */
.alerts{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px 0;max-height:230px;overflow-y:auto;}
.alert-row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--border-soft);font-size:13px;}
.alert-row:last-child{border-bottom:none;}
.alert-row .tm{color:var(--text-faint);font-size:11px;width:52px;flex:none;font-family:'Space Grotesk',sans-serif;}
.alert-row .fac{width:44px;flex:none;font-size:11px;font-weight:600;}
.alert-row .fac.jc{color:var(--jc);}
.alert-row .fac.wj{color:var(--wj);}
.alert-row .msg{flex:1;color:var(--text);}
.alert-row .lvl{width:8px;height:8px;border-radius:50%;flex:none;}
.alert-row .lvl.info{background:var(--idle);}
.alert-row .lvl.warn{background:var(--warn);}
.alert-row .lvl.bad{background:var(--bad);}

/* ===== Equipment detail grid ===== */
.eqgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;}
.eqcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;}
.eqcard .eqhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.eqcard .eqid{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
.statuspill{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600;display:flex;align-items:center;gap:5px;}
.statuspill .d{width:6px;height:6px;border-radius:50%;}
.statuspill.on{background:var(--ok-dim);color:var(--ok);}
.statuspill.on .d{background:var(--ok);}
.statuspill.off{background:var(--bad-dim);color:var(--bad);}
.statuspill.off .d{background:var(--bad);}
.statuspill.chk{background:var(--warn-dim);color:var(--warn);}
.statuspill.chk .d{background:var(--warn);}
.eqcard .item{font-size:13px;color:var(--text-dim);margin-bottom:14px;min-height:16px;}
.eqcard .eqnum{display:flex;align-items:baseline;gap:6px;margin-bottom:8px;}
.eqcard .eqnum .cur{font-size:24px;}
.eqcard .eqnum .tgt{font-size:13px;color:var(--text-faint);}
.eqcard .footline{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);margin-top:8px;}

/* WIP strip */
.wipgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.wipcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center;}
.wipcard .wl{font-size:11px;color:var(--text-faint);margin-bottom:8px;}
.wipcard .wv{font-size:24px;}
.wipcard .wv .u{font-size:12px;color:var(--text-dim);font-weight:500;}
.wipcard .arrow{font-size:11px;color:var(--text-faint);margin-top:6px;}

/* Trend sparkline */
.trendcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;}
.trend-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
.trend-head .th-l{font-size:13px;color:var(--text-dim);}
.trend-head .th-v{font-size:13px;color:var(--text-faint);}
.spark{display:flex;align-items:flex-end;gap:6px;height:90px;}
.spark .bar{flex:1;border-radius:3px 3px 0 0;position:relative;min-height:3px;transition:height .5s;}
.spark .bar .lbl{
  position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--text-faint);
}

/* Footer summary */
.footsum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.fs-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.fs-card .fl{font-size:11px;color:var(--text-faint);margin-bottom:6px;}
.fs-card .fv{font-size:21px;}
.fs-card .fv .u{font-size:12px;color:var(--text-dim);font-weight:500;}

.viewhint{font-size:11px;color:var(--text-faint);text-align:center;padding:10px;}

@media (max-width:900px){
  .grid2{grid-template-columns:1fr;}
  .footsum{grid-template-columns:repeat(2,1fr);}
  .wipgrid{grid-template-columns:repeat(2,1fr);}
  .rail{flex-wrap:wrap;}
  .rail-stage{min-width:120px;}
}


:root{
  --bg:#0A0E13;
  --panel:#131920;
  --panel-2:#1A222B;
  --border:#242E3A;
  --border-soft:#1D2530;
  --text:#EAEFF5;
  --text-dim:#8A97A8;
  --text-faint:#5B6675;
  --jc:#E8A33D; --jc-dim:rgba(232,163,61,.13); --jc-line:rgba(232,163,61,.4);
  --wj:#3FA9F5; --wj-dim:rgba(63,169,245,.13); --wj-line:rgba(63,169,245,.4);
  --ok:#2ECC71; --ok-dim:rgba(46,204,113,.14);
  --warn:#F2B33D; --warn-dim:rgba(242,179,61,.14);
  --bad:#F0553F; --bad-dim:rgba(240,85,63,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;width:100%;min-height:100%;}
.num{font-family:'Space Grotesk','Noto Sans KR',sans-serif;font-variant-numeric:tabular-nums;font-weight:600;}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 100px;}

.hd{padding:6px 2px 18px;}
.hd h1{font-size:19px;font-weight:700;}
.hd .s{font-size:12.5px;color:var(--text-faint);margin-top:4px;}

.facsel{display:flex;gap:8px;margin-bottom:18px;}
.facbtn{
  flex:1;padding:13px;border-radius:10px;text-align:center;font-size:15px;font-weight:600;
  background:var(--panel);border:1px solid var(--border);color:var(--text-dim);
}
.facbtn.on.jc{background:var(--jc-dim);border-color:var(--jc-line);color:var(--jc);}
.facbtn.on.wj{background:var(--wj-dim);border-color:var(--wj-line);color:var(--wj);}

.catsel{display:flex;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:18px;}
.catbtn{flex:1;text-align:center;padding:9px;border-radius:7px;font-size:13.5px;color:var(--text-dim);font-weight:500;}
.catbtn.on{background:var(--panel-2);color:var(--text);}

.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;}
.card .hdr{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;}
.card .hdr .left{display:flex;flex-direction:column;gap:4px;}
.card .hdr .name{font-size:15.5px;font-weight:700;}
.card .hdr .meta{font-size:12px;color:var(--text-faint);}
.pill{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600;display:flex;align-items:center;gap:5px;}
.pill .d{width:6px;height:6px;border-radius:50%;}
.pill.on{background:var(--ok-dim);color:var(--ok);}.pill.on .d{background:var(--ok);}
.pill.off{background:var(--bad-dim);color:var(--bad);}.pill.off .d{background:var(--bad);}
.pill.chk{background:var(--warn-dim);color:var(--warn);}.pill.chk .d{background:var(--warn);}

.body{padding:16px;border-top:1px solid var(--border-soft);}
.card .hdr{border-bottom:1px solid var(--border-soft);}
.quickrow{display:flex;gap:8px;margin-bottom:12px;}
.quickrow .field{margin-bottom:0;flex:1;}
.applybtn{flex:none;padding:0 16px;border-radius:9px;background:var(--panel-2);border:1px solid var(--border-soft);color:var(--text);font-size:13.5px;font-weight:600;}
.applybtn:active{background:var(--border);}
.notetoggle{font-size:12.5px;color:var(--text-dim);padding:10px 0;text-align:center;border-top:1px dashed var(--border-soft);margin-top:4px;cursor:pointer;}
.notebox{margin-top:10px;}
.deeplinkback{display:block;text-align:center;font-size:12.5px;color:var(--text-dim);padding:10px;margin-bottom:10px;background:var(--panel);border:1px solid var(--border);border-radius:9px;text-decoration:none;}

.label{font-size:12px;color:var(--text-faint);margin:0 0 8px;}
.seg{display:flex;gap:6px;margin-bottom:16px;}
.segbtn{flex:1;padding:11px 4px;text-align:center;border-radius:8px;font-size:13px;font-weight:600;background:var(--panel-2);border:1px solid var(--border-soft);color:var(--text-dim);}
.segbtn.sel-on{background:var(--ok-dim);border-color:rgba(46,204,113,.4);color:var(--ok);}
.segbtn.sel-chk{background:var(--warn-dim);border-color:rgba(242,179,61,.4);color:var(--warn);}
.segbtn.sel-off{background:var(--bad-dim);border-color:rgba(240,85,63,.4);color:var(--bad);}

.stepper{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.stepbtn{
  width:46px;height:46px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border-soft);
  color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;font-weight:600;
}
.stepbtn:active{background:var(--border);}
.stepval{
  flex:1;text-align:center;font-size:24px;background:var(--panel-2);border:1px solid var(--border-soft);
  border-radius:10px;padding:11px 0;
}
.stepval .u{font-size:12px;color:var(--text-dim);font-weight:500;margin-left:4px;}
.tgtline{font-size:11.5px;color:var(--text-faint);margin:-10px 0 16px;text-align:center;}

.field{width:100%;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:9px;
  padding:12px 13px;color:var(--text);font-size:14.5px;font-family:'Noto Sans KR',sans-serif;margin-bottom:14px;}
textarea.field{resize:vertical;min-height:60px;}
.field::placeholder{color:var(--text-faint);}

.savebtn{width:100%;padding:13px;border-radius:10px;background:var(--text);color:var(--bg);
  font-size:15px;font-weight:700;border:none;}
.savebtn:active{opacity:.85;}
.savebtn.jc{background:var(--jc);}
.savebtn.wj{background:var(--wj);}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--panel-2);border:1px solid var(--border);color:var(--text);
  padding:12px 20px;border-radius:10px;font-size:13.5px;opacity:0;transition:all .25s;
  display:flex;align-items:center;gap:8px;box-shadow:0 6px 22px rgba(0,0,0,.4);z-index:10;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .d{width:7px;height:7px;border-radius:50%;background:var(--ok);}

.updated{font-size:11px;color:var(--text-faint);margin-top:2px;}
.loading{text-align:center;color:var(--text-faint);font-size:13px;padding:40px 0;}

</style>
</head>
<body>
<div id="dashboardRoot">


<div class="topbar">
  <div class="brand">
    <div class="mark">PD</div>
    <div>
      <h1>실시간 생산현황판</h1>
      <div class="sub" id="viewSub">통합 현황 · 제천 / 원주</div>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab" data-tab="combined">통합</div>
    <div class="tab" data-tab="jecheon">제천</div>
    <div class="tab" data-tab="wonju">원주</div>
  </div>
  <div class="clockbox">
    <div class="clock" id="clock">00:00:00</div>
    <div class="date" id="dateStr">2026년 1월 1일</div>
    <div class="livepill"><span class="dot"></span><span id="syncStatus">LIVE</span></div>
  </div>
</div>

<div class="rail-wrap">
  <div class="rail-label">공정 흐름</div>
  <div class="rail" id="rail"></div>
</div>

<div class="main" id="main"></div>


</div>
<div id="inputRoot" style="display:none">

<div class="wrap">
  <div class="hd">
    <h1>생산실적 입력</h1>
    <div class="s">설비를 선택해 현재 상태와 생산량을 입력하세요. 저장하면 현황판에 바로 반영됩니다.</div>
  </div>

  <div class="facsel" id="facSel">
    <div class="facbtn jc" data-fac="jecheon">제천공장</div>
    <div class="facbtn wj" data-fac="wonju">원주공장</div>
  </div>

  <div class="catsel" id="catSel">
    <div class="catbtn" data-cat="single">1공정 싱글</div>
    <div class="catbtn" data-cat="press">2공정 프레스</div>
    <div class="catbtn" data-cat="inspect">4공정 검단</div>
  </div>

  <div id="list"><div class="loading">불러오는 중…</div></div>
</div>

<div class="toast" id="toast"><span class="d"></span><span id="toastMsg">저장되었습니다</span></div>


</div>
<script>
/* ============================================================
   구글 시트 연동 설정
   Apps Script를 웹앱으로 배포한 뒤 생성되는 URL을 아래에 붙여넣으세요.
   예) https://script.google.com/macros/s/AKfycb.../exec
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzyvUYQn4NcGMf7tb4ZX5z8wDs7fb8gCoxRWNMKpfsaTcUw3kikAKOy_ju4OpkTPhrZeQ/exec';

/* 공장별 고정 정보(목표량, 재공재고 표기 등)는 시트에 없는 값이라 여기서 관리합니다.
   실제 값으로 바뀌면 이 부분만 수정하면 됩니다. */
const FACTORY_META = {
  jecheon:{ name:'제천공장', short:'제천', accent:'jc', targetFinal:6500, wip:{single:1380,press:960,laminate:420,pack:610} },
  wonju:{ name:'원주공장', short:'원주', accent:'wj', targetFinal:7400, wip:{single:1610,press:1120,laminate:530,pack:780} }
};

let FACTORIES = {
  jecheon:{...FACTORY_META.jecheon, single:[], press:[], inspect:[]},
  wonju:{...FACTORY_META.wonju, single:[], press:[], inspect:[]}
};
let alerts = [];
let trendJC = [520,610,590,680,720,640,700,610];
let trendWJ = [640,700,680,760,810,700,790,720];
let currentTab = 'combined';

/* ================= 공통 유틸 ================= */
function statusInfo(s){
  if(s==='on') return {cls:'on',label:'가동중',dotcls:'ok'};
  if(s==='off') return {cls:'off',label:'정지',dotcls:'bad'};
  return {cls:'chk',label:'점검중',dotcls:'warn'};
}
function statusLabel(s){return s==='on'?'가동중':s==='off'?'정지':'점검중';}
function pct(cur,tgt){return tgt>0 ? Math.min(100, Math.round(cur/tgt*100)) : 0;}
function pbarClass(p){return p>=90?'ok':p>=60?'ok':p>=30?'warn':'bad';}
function fmtM(n){return Math.round(Number(n)||0).toLocaleString('ko-KR');}
function fmtTime(v){
  try{
    const d = new Date(v);
    if(isNaN(d.getTime())) return String(v).slice(0,5);
    return d.toLocaleTimeString('ko-KR',{hour12:false,hour:'2-digit',minute:'2-digit'});
  }catch(e){ return String(v).slice(0,5); }
}

/* ================= 구글 시트 API 연동 ================= */
async function fetchState(){
  if(API_URL === 'YOUR_WEB_APP_URL_HERE'){
    setSyncLabel('URL 미설정', false);
    return;
  }
  try{
    const res = await fetch(API_URL+'?action=state');
    const rows = await res.json();
    const grouped = {jecheon:{single:[],press:[],inspect:[]}, wonju:{single:[],press:[],inspect:[]}};
    rows.forEach(r=>{
      if(!grouped[r.factory] || !grouped[r.factory][r.category]) return;
      grouped[r.factory][r.category].push({
        id:r.id, item:r.item, status:r.status,
        cur:Number(r.cur)||0, tgt:Number(r.tgt)||1, startHour:r.startHour||8
      });
    });
    ['jecheon','wonju'].forEach(k=>{
      FACTORIES[k] = {...FACTORY_META[k], ...grouped[k]};
    });

    const ares = await fetch(API_URL+'?action=alerts');
    const arows = await ares.json();
    alerts = arows.map(a=>({t:fmtTime(a.time), fac:a.factory, lvl:a.level, msg:a.message}));

    setSyncLabel('LIVE', true);
  }catch(err){
    console.error(err);
    setSyncLabel('연결 대기중', false);
  }
}

async function postUpdate(payload){
  if(API_URL === 'YOUR_WEB_APP_URL_HERE'){ throw new Error('API_URL 미설정'); }
  await fetch(API_URL, {method:'POST', body: JSON.stringify(payload)});
}

const syncStatusEl = document.getElementById('syncStatus');
function setSyncLabel(text, ok){
  if(!syncStatusEl) return;
  syncStatusEl.textContent = text;
  syncStatusEl.style.color = ok ? 'var(--ok)' : 'var(--warn)';
}

/* ================= 현황판 렌더 ================= */
function renderRail(){
  const f = currentTab==='wonju' ? FACTORIES.wonju : currentTab==='jecheon' ? FACTORIES.jecheon : null;
  const rail = document.getElementById('rail');
  let sumSingle,sumPress,sumInspect,sumFinal,tgtFinal;
  if(f){
    sumSingle = f.single.reduce((a,e)=>a+e.cur,0);
    sumPress = f.press.reduce((a,e)=>a+e.cur,0);
    sumInspect = f.inspect.reduce((a,e)=>a+e.cur,0);
    sumFinal = Math.round(sumInspect*0.94);
    tgtFinal = f.targetFinal;
  } else {
    sumSingle = FACTORIES.jecheon.single.reduce((a,e)=>a+e.cur,0)+FACTORIES.wonju.single.reduce((a,e)=>a+e.cur,0);
    sumPress = FACTORIES.jecheon.press.reduce((a,e)=>a+e.cur,0)+FACTORIES.wonju.press.reduce((a,e)=>a+e.cur,0);
    sumInspect = FACTORIES.jecheon.inspect.reduce((a,e)=>a+e.cur,0)+FACTORIES.wonju.inspect.reduce((a,e)=>a+e.cur,0);
    sumFinal = Math.round(sumInspect*0.94);
    tgtFinal = FACTORIES.jecheon.targetFinal+FACTORIES.wonju.targetFinal;
  }
  const stageVals = [
    {name:'원사/레진/필름 투입', val:'정상 공급', st:'ok'},
    {name:'1공정 싱글', val:fmtM(sumSingle)+' M', st: sumSingle>0?'ok':'bad'},
    {name:'2공정 프레스', val:fmtM(sumPress)+' M', st: sumPress>0?'ok':'warn'},
    {name:'3/4공정', val:'재프레스·라미·검단', st:'ok'},
    {name:'검단', val:fmtM(sumInspect)+' M', st:'ok'},
    {name:'포장', val:fmtM(Math.round(sumFinal*0.9))+' M', st:'ok'},
    {name:'완제품', val:fmtM(sumFinal)+' / '+fmtM(tgtFinal)+' M', st: sumFinal/tgtFinal>0.5?'ok':'warn'}
  ];
  rail.innerHTML = stageVals.map((s,i)=>{
    const arrow = i<stageVals.length-1 ? '<div class="rail-arrow">›</div>' : '';
    return `<div class="rail-stage st-${s.st}"><div class="rail-name">${s.name}</div><div class="rail-val num">${s.val}</div></div>${arrow}`;
  }).join('');
}

}

  return `
  <div class="eqcard">
    <div class="eqhead">
      <div class="eqid">${e.id}</div>
      <div class="statuspill ${si.cls}"><span class="d"></span>${si.label}</div>
    </div>
    <div class="item">${e.item}</div>
    <div class="eqnum"><span class="cur num">${fmtM(e.cur)}</span><span class="tgt num">/ ${fmtM(e.tgt)} M</span></div>
    <div class="progress ${pbarClass(p)}"><div style="width:${p}%"></div></div>
    <div class="footline"><span>목표 대비 ${p}%</span><span>가동 시작 ${e.startHour}:00</span></div>
  </div>`;
}

/* ================= 생산실적 입력 폼 로직 (빠른 입력 / 자동저장) ================= */
let curFac = 'jecheon';
let curCat = 'single';
const saveTimers = {};

/* QR코드/바로가기 딥링크: ?mode=input&fac=jecheon&cat=single&eq=0
   특정 설비 화면으로 바로 열리게 하고 싶을 때 이 파라미터를 붙인 주소를 만들어
   QR코드로 인쇄해 설비에 붙여두면 스캔 한 번으로 그 설비만 뜹니다. */
const deepFac = urlParams.get('fac');
const deepCat = urlParams.get('cat');
const deepEq = urlParams.get('eq');
let deepLinkMode = false;
if(deepFac && deepCat && (deepFac==='jecheon'||deepFac==='wonju')){
  curFac = deepFac;
  curCat = deepCat;
  deepLinkMode = true;

  const backLink = deepLinkMode ? `<a class="deeplinkback" href="?mode=input">◀ 전체 설비 목록 보기</a>` : '';

          <div class="segbtn ${e.status==='chk'?'sel-chk':''}" id="seg-chk-${uid}" onclick="quickStatus('${uid}','chk')">점검중</div>
          <div class="segbtn ${e.status==='off'?'sel-off':''}" id="seg-off-${uid}" onclick="quickStatus('${uid}','off')">정지</div>
        </div>
        <div class="label">누적 생산량 (M) · +/- 는 잠시 후 자동저장</div>
        <div class="stepper">
          <div class="stepbtn" onclick="quickStep('${uid}',-50)">−</div>

          <div class="stepbtn" onclick="quickStep('${uid}',50)">+</div>
        </div>

        <div class="quickrow">
          <input class="field" type="number" inputmode="numeric" id="num-${uid}" value="${e.cur}" placeholder="직접 입력">
          <button class="applybtn" onclick="applyNum('${uid}')">적용</button>
        </div>
        <div class="notetoggle" onclick="toggleNote('${uid}')">＋ 품목/특이사항 입력</div>
        <div class="notebox" id="note-box-${uid}" style="display:none">
          <div class="label">생산 품목 / 규격</div>
          <input class="field" type="text" id="item-${uid}" value="${e.item}">
          <div class="label">특이사항</div>
          <textarea class="field" id="noteinput-${uid}" placeholder="예: 원단 교체로 15분 지연"></textarea>
          <button class="savebtn ${data.accent}" onclick="saveNote('${uid}')">메모 저장</button>
        </div>
        <div class="updated" id="upd-${uid}"></div>
      </div>
    </div>`;
  }).join('');
}

function uidParts(uid){
  const p = uid.split('-');
  return { cat: p[1], idx: parseInt(p[2]) };
}

/* 상태 버튼: 탭하는 즉시 저장 (디바운스 없음) */
function quickStatus(uid, status){
  const {cat, idx} = uidParts(uid);
  FACTORIES[curFac][cat][idx].status = status;
  // 화면 일부만 즉시 갱신 (전체 재렌더링으로 인한 입력 포커스 끊김 방지)
  const pill = document.getElementById('pill-'+uid);
  if(pill){ pill.className = 'pill '+status; pill.innerHTML = `<span class="d"></span>${statusLabel(status)}`; }
  ['on','chk','off'].forEach(s=>{
    const el = document.getElementById(`seg-${s}-${uid}`);
    if(el) el.className = 'segbtn' + (s===status ? (s==='on'?' sel-on':s==='chk'?' sel-chk':' sel-off') : '');
  });
  commitSave(uid);
}

/* +/- 버튼: 연타 대응을 위해 700ms 후 자동저장 */
function quickStep(uid, delta){
  const {cat, idx} = uidParts(uid);
  const eqObj = FACTORIES[curFac][cat][idx];
  eqObj.cur = Math.max(0, eqObj.cur + delta);
  const valEl = document.getElementById('val-'+uid);
  const numEl = document.getElementById('num-'+uid);
  if(valEl) valEl.innerHTML = fmtM(eqObj.cur)+'<span class="u">M</span>';
  if(numEl) numEl.value = eqObj.cur;
  clearTimeout(saveTimers[uid]);
  saveTimers[uid] = setTimeout(()=>commitSave(uid), 700);
}

/* 직접 입력 숫자: 적용 버튼 눌러야 저장 (오타 방지) */
function applyNum(uid){
  const {cat, idx} = uidParts(uid);
  const numEl = document.getElementById('num-'+uid);
  const v = Math.max(0, parseInt(numEl.value||'0'));
  FACTORIES[curFac][cat][idx].cur = v;
  const valEl = document.getElementById('val-'+uid);
  if(valEl) valEl.innerHTML = fmtM(v)+'<span class="u">M</span>';
  clearTimeout(saveTimers[uid]);
  commitSave(uid);
}

function toggleNote(uid){
  const box = document.getElementById('note-box-'+uid);
  if(box) box.style.display = (box.style.display==='none') ? '' : 'none';
}

async function saveNote(uid){
  const {cat, idx} = uidParts(uid);
  const itemEl = document.getElementById('item-'+uid);
  const noteEl = document.getElementById('noteinput-'+uid);
  const newItem = itemEl.value.trim();
  const note = noteEl.value.trim();
  FACTORIES[curFac][cat][idx].item = newItem;
  const eq = FACTORIES[curFac][cat][idx];
  try{
    await postUpdate({type:'update', factory:curFac, category:cat, id:eq.id, item:newItem, status:eq.status, cur:eq.cur});
    if(note){
      const now = new Date().toLocaleTimeString('ko-KR',{hour12:false});
      await postUpdate({type:'alert', time:now, factory: curFac==='jecheon'?'jc':'wj', level:'info', message: `${FACTORIES[curFac].short} ${eq.id}: ${note}`});
    }
    showToast('메모 저장됨');
    noteEl.value = '';
  }catch(err){
    showToast('저장 실패 - 연결 확인');
    console.error(err);
  }
}

/* 상태/생산량 실제 서버 반영 (자동저장 공통 처리) */
async function commitSave(uid){
  const {cat, idx} = uidParts(uid);
  const eq = FACTORIES[curFac][cat][idx];
  try{
    await postUpdate({type:'update', factory:curFac, category:cat, id:eq.id, item:eq.item, status:eq.status, cur:eq.cur});
    if(eq.status !== 'on'){
      const now = new Date().toLocaleTimeString('ko-KR',{hour12:false});
      const msg = `${FACTORIES[curFac].short} ${eq.id} ${statusLabel(eq.status)} (생산량 ${fmtM(eq.cur)} M)`;
      await postUpdate({type:'alert', time:now, factory: curFac==='jecheon'?'jc':'wj', level: eq.status==='off'?'bad':'warn', message: msg});
    }
    const nowT = new Date().toLocaleTimeString('ko-KR',{hour12:false});
    const updEl = document.getElementById('upd-'+uid);
    if(updEl) updEl.textContent = '마지막 저장: '+nowT;
    showToast('저장됨');
  }catch(err){
    showToast('저장 실패 - 연결 확인');
    console.error(err);
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

document.getElementById('facSel').addEventListener('click', e=>{
  const b = e.target.closest('.facbtn');
  if(!b || deepLinkMode) return;
  curFac = b.dataset.fac;
  updateFacUI();
  renderList();
});
document.getElementById('catSel').addEventListener('click', e=>{
  const b = e.target.closest('.catbtn');
  if(!b || deepLinkMode) return;
  curCat = b.dataset.cat;
  updateCatUI();
  renderList();
});
function updateFacUI(){
  document.querySelectorAll('.facbtn').forEach(b=>b.classList.toggle('on', b.dataset.fac===curFac));
}
function updateCatUI(){
  document.querySelectorAll('.catbtn').forEach(b=>b.classList.toggle('on', b.dataset.cat===curCat));
}
updateFacUI(); updateCatUI();
if(deepLinkMode){
  const facSelEl = document.getElementById('facSel');
  const catSelEl = document.getElementById('catSel');
  if(facSelEl) facSelEl.style.display = 'none';
  if(catSelEl) catSelEl.style.display = 'none';
}

/* ================= 최초 로딩 ================= */
(async function init(){
  setTab(['combined','jecheon','wonju'].includes(initView) ? initView : 'combined');
  await fetchState();
  render();
})();

</script>
